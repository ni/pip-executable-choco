name: PR Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  powershell-validation:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          $installed = Get-Module -ListAvailable -Name Pester | Sort-Object Version -Descending | Select-Object -First 1
          if ($null -eq $installed -or $installed.Version -lt [version]'5.4.0') {
            Set-PSRepository PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
            Install-Module Pester -MinimumVersion 5.4.0 -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck
          }

      - name: Run installer branch validation
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.4.0 -Force
          Invoke-Pester -Path .\tests -CI -Output Detailed